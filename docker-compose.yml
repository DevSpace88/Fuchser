name: fuchser
# ============================================================================
# docker-compose.yml — PRODUCTION deployment on Coolify
# ============================================================================
# Changes compared to the dev variant:
#   * frontend: instead of a node dev server, now the multi-stage production
#     build (build Vite -> serve via nginx). Fixes "npm /app/package.json ENOENT".
#   * backend:  NO host volume mount anymore. The code gets into the image via
#     `COPY . .` (backend/Dockerfile), so alembic.ini is preserved.
#     Fixes "No 'script_location' key found".
#   * db:       healthcheck without ${...} interpolation (more robust during
#     Compose parsing), explicit volume name.
#
# Coolify maps the domains via docker_compose_domains (backend/frontend)
# and routes through a reverse proxy. The internal ports therefore only need
# to be visible via `expose` + the service reachable via its service name.
# ============================================================================

services:

  # ---------------------------------------------------------------------------
  # 1) DATABASE (PostgreSQL) — as part of the Compose stack
  # ---------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: fuchser-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    # No port exposed to the outside — only reachable internally.
    expose:
      - "5432"
    volumes:
      - fuchser_pgdata:/var/lib/postgresql/data
    healthcheck:
      # The PostgreSQL-internal user "postgres" always exists, so a
      # pg_isready that doesn't target the app DB is the most robust here.
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # REDIS — queue + pub/sub for background tasks (reload-safe agents)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fuchser-redis
    volumes:
      - fuchser_redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2) BACKEND (FastAPI) — its own build, no volume overlay
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuchser-backend
    environment:
      - ENVIRONMENT=prod
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - POSTGRES_USER=${POSTGRES_USER:-app_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - POSTGRES_DB=${POSTGRES_DB:-app_db}
      # The DB service is called "db" in the Compose network.
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://fuchser.sergejgorochow.de}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-}
      # --- Agent (Deep Research) ---
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - GLM_MODEL=${GLM_MODEL:-glm-5.3}
      - GLM_BASE_URL=${GLM_BASE_URL:-https://api.z.ai/api/coding/paas/v4}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8000"
    # Run migrations after startup, then uvicorn WITHOUT --reload (prod).
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # WORKER — runs LangGraph graphs independently of the API
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuchser-worker
    environment:
      - ENVIRONMENT=prod
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_USER=${POSTGRES_USER:-app_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - POSTGRES_DB=${POSTGRES_DB:-app_db}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - GLM_MODEL=${GLM_MODEL:-glm-5.3}
      - GLM_BASE_URL=${GLM_BASE_URL:-https://api.z.ai/api/coding/paas/v4}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
    command: python -m app.worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 3) FRONTEND (Vite production build -> nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fuchser-frontend
    # VITE_API_URL is set at build time. In production we serve
    # from the same domain host; therefore leave it empty for relative /api paths.
    environment:
      - VITE_API_URL=${VITE_API_URL:-}
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  fuchser_pgdata:
  fuchser_redisdata:
