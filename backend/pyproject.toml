# ============================================================================
# pyproject.toml — central project configuration for the backend
# ============================================================================
# In Python there used to be setup.py/setup.cfg; the newer approach is ONE file
# for everything: here we define metadata, dependencies, tool settings.
# As package manager we use `uv` (modern, very fast).

[project]
name = "fuchser-backend"
version = "0.1.0"
description = "Fuchser — AI deep-research assistant (FastAPI, LangGraph, SQLModel, React)."
requires-python = ">=3.12"
readme = "../README.md"

# ----------------------------------------------------------------------------
# Production dependencies
# ----------------------------------------------------------------------------
# FastAPI itself + Uvicorn (the ASGI server that runs FastAPI).
dependencies = [
    # FastAPI + server + CLI ("standard" pulls in uvicorn, httptools etc.).
    "fastapi[standard]>=0.118",
    # Pydantic[email]: makes EmailStr work (pulls in email-validator).
    "pydantic[email]>=2.9",
    # SQLModel: unifies SQLAlchemy (ORM) + Pydantic (validation) in ONE model.
    # Recommendation of the FastAPI skill: use SQLModel instead of raw SQLAlchemy.
    "sqlmodel>=0.0.22",
    # Async driver for PostgreSQL (for the app itself, async engine).
    "asyncpg>=0.30",
    # Sync driver for PostgreSQL (for Alembic — see backend/alembic/env.py).
    # Alembic runs synchronously, asyncpg does not work there. psycopg3 is the
    # modern standard for sync access (successor of psycopg2).
    "psycopg[binary]>=3.2",
    # Alembic: migration tool for schema changes (similar to Laravel migrations).
    "alembic>=1.13",
    # Pydantic-Settings: loads configuration from .env into typed Python objects.
    "pydantic-settings>=2.5",
    # JWT library. We use it LOW-LEVEL (encode/decode ourselves),
    # instead of a high-level lib like fastapi-jwt-auth (unmaintained).
    "pyjwt>=2.9",
    # Password hashing (Argon2/Bcrypt). Modern replacement for passlib (unmaintained).
    "pwdlib[argon2,bcrypt]>=0.2.1",
    # Python-dotenv, so pydantic-settings reads the .env directly.
    "python-dotenv>=1.0",
    "langgraph>=1.2.11",
    "langchain-deepseek>=1.1.0",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-postgres>=3.1.2",
    "ddgs>=9.16.0",
    "xhtml2pdf>=0.2.17",
    "markdown>=3.10.3",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "redis[hiredis]>=8.1.0",
]

# ----------------------------------------------------------------------------
# Dev dependencies (only for development/tests, not for production)
# ----------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",          # async test support
    "httpx>=0.27",                   # async HTTP client for backend testing
    "anyio>=4.4",                    # for httpx + async tests
    "ruff>=0.7",                     # linter + formatter (recommended by the FastAPI skill)
    # For tests with a real Postgres DB on localhost: We use a SQLite in-memory
    # DB in tests (see tests/conftest.py), so no additional driver is needed.
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.4",
]

# ----------------------------------------------------------------------------
# FastAPI settings: where is the app?
# ----------------------------------------------------------------------------
# Allows `fastapi dev` / `fastapi run` without an explicit file path.
[tool.fastapi]
entrypoint = "app.main:app"

# ----------------------------------------------------------------------------
# Ruff — Linting & Formatting
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Selection of rule sets:
#   E/W  = pycodestyle (PEP8)
#   F    = pyflakes (unused imports etc.)
#   I    = isort (import order)
#   B    = bugbear (common bug patterns)
#   FAST = FastAPI-specific rules (safer code)
#   UP   = pyupgrade (more modern Python syntax)
select = ["E", "W", "F", "I", "B", "FAST", "UP"]
ignore = [
    "B008",  # Depends(...) as a default argument is idiomatic in FastAPI.
]

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"               # async tests automatically run as coroutines
testpaths = ["tests"]
pythonpath = ["."]                  # so `import app...` works in the tests
