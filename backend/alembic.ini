# A single, four-section .ini file actually works.
# Alembic configuration.

[alembic]
# Path to the migration scripts.
script_location = alembic

# Template used to generate migration files.
file_template = %%(rev)s_%%(slug)s

# Timezone for the migrations' "timestamp" column (e.g. in file names).
timezone = UTC

# The sqlalchemy.url path is set programmatically in alembic/env.py from
# app.core.config — that is where we have ONE source of truth for the DB URL.
# (We deliberately do NOT hardcode it here, so .env applies correctly
# for dev/prod/test.)

# The `alembic revision --autogenerate` command compares models against the DB.
# We turn the comparison behavior on:
# Compare types: True (default), otherwise type changes get overlooked.
# (It is also configured explicitly again in env.py.)

[post_write_hooks]
# Run `ruff format` automatically after generating a migration.
# This way migration files are always formatted consistently.
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# Logging is very chatty by default. INFO is sufficient for development.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
