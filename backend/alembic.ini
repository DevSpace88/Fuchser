# A single, four-section .ini file actually works.
# Alembic configuration.

[alembic]
# Path to the migration scripts.
script_location = alembic

# Template used to generate migration files.
file_template = %%(rev)s_%%(slug)s

# Timezone für die "timestamp"-Spalte der Migrationen (z. B. in Dateinamen).
timezone = UTC

# Path to the sqlalchemy.url is set programmatically in alembic/env.py aus der
# app.core.config — dort haben wir EINE Quelle der Wahrheit für die DB-URL.
# (Wir setzen sie bewusst NICHT hier hart, damit .env für Dev/Prod/Test korrekt
# greift.)

# Kommando `alembic revision --autogenerate` vergleicht Modelle mit DB.
# Wir schalten das Vergleichs-Verhalten ein:
# Compare types: True (Default), sonst werden Typ-Änderungen übersehen.
# (Wird in env.py nochmals explizit konfiguriert.)

[post_write_hooks]
# Nach dem Generieren einer Migration automatisch `ruff format` ausführen.
# So sind Migrations-Dateien immer gleich formatiert.
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# Logging ist per Default sehr gesprächig. Für Entwicklung reicht INFO.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
